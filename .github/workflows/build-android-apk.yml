name: Build Android APK (DebtReport)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Clean Standalone Android Project
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/fintech/debtreport
          mkdir -p app/src/main/assets
          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            'rootProject.name = "DebtReport"' \
            'include(":app")' \
            > settings.gradle.kts
          printf '%s\n' \
            'plugins {' \
            '    id("com.android.application") version "8.5.2" apply false' \
            '    id("org.jetbrains.kotlin.android") version "1.9.24" apply false' \
            '}' \
            > build.gradle.kts
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'kotlin.code.style=official' \
            'android.nonTransitiveRClass=true' \
            > gradle.properties
          printf '%s\n' \
            'plugins {' \
            '    id("com.android.application")' \
            '    id("org.jetbrains.kotlin.android")' \
            '}' \
            '' \
            'android {' \
            '    namespace = "com.fintech.debtreport"' \
            '    compileSdk = 34' \
            '' \
            '    defaultConfig {' \
            '        applicationId = "com.fintech.debtreport"' \
            '        minSdk = 24' \
            '        targetSdk = 34' \
            '        versionCode = 12' \
            '        versionName = "1.2.0"' \
            '    }' \
            '' \
            '    buildTypes {' \
            '        debug {' \
            '            isDebuggable = true' \
            '        }' \
            '        release {' \
            '            isMinifyEnabled = false' \
            '        }' \
            '    }' \
            '    compileOptions {' \
            '        sourceCompatibility = JavaVersion.VERSION_17' \
            '        targetCompatibility = JavaVersion.VERSION_17' \
            '    }' \
            '    kotlinOptions {' \
            '        jvmTarget = "17"' \
            '    }' \
            '}' \
            '' \
            'dependencies {' \
            '}' \
            > app/build.gradle.kts
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '' \
            '    <uses-permission android:name="android.permission.INTERNET" />' \
            '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' \
            '    <uses-permission android:name="android.permission.VIBRATE" />' \
            '' \
            '    <application' \
            '        android:allowBackup="true"' \
            '        android:label="DebtReport"' \
            '        android:supportsRtl="true"' \
            '        android:usesCleartextTraffic="true"' \
            '        android:hardwareAccelerated="true"' \
            '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar">' \
            '        <activity' \
            '            android:name="com.fintech.debtreport.MainActivity"' \
            '            android:exported="true"' \
            '            android:configChanges="orientation|screenSize|keyboardHidden">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '' \
            '</manifest>' \
            > app/src/main/AndroidManifest.xml
          printf '%s\n' \
            'package com.fintech.debtreport' \
            '' \
            'import android.annotation.SuppressLint' \
            'import android.app.Activity' \
            'import android.content.Context' \
            'import android.graphics.Color' \
            'import android.os.Build' \
            'import android.os.Bundle' \
            'import android.os.VibrationEffect' \
            'import android.os.Vibrator' \
            'import android.view.View' \
            'import android.view.Window' \
            'import android.webkit.JavascriptInterface' \
            'import android.webkit.WebChromeClient' \
            'import android.webkit.WebResourceRequest' \
            'import android.webkit.WebSettings' \
            'import android.webkit.WebView' \
            'import android.webkit.WebViewClient' \
            'import android.widget.FrameLayout' \
            'import android.widget.TextView' \
            '' \
            'class MainActivity : Activity() {' \
            '    private var webView: WebView? = null' \
            '' \
            '    @SuppressLint("SetJavaScriptEnabled", "AddJavascriptInterface")' \
            '    override fun onCreate(savedInstanceState: Bundle?) {' \
            '        super.onCreate(savedInstanceState)' \
            '' \
            '        try {' \
            '            requestWindowFeature(Window.FEATURE_NO_TITLE)' \
            '        } catch (_: Throwable) {}' \
            '' \
            '        try {' \
            '            window.statusBarColor = Color.parseColor("#050709")' \
            '            window.navigationBarColor = Color.parseColor("#050709")' \
            '        } catch (_: Throwable) {}' \
            '' \
            '        try {' \
            '            val wv = WebView(this).apply {' \
            '                setBackgroundColor(Color.parseColor("#050709"))' \
            '                overScrollMode = View.OVER_SCROLL_NEVER' \
            '                settings.apply {' \
            '                    javaScriptEnabled = true' \
            '                    domStorageEnabled = true' \
            '                    databaseEnabled = true' \
            '                    cacheMode = WebSettings.LOAD_DEFAULT' \
            '                    mediaPlaybackRequiresUserGesture = false' \
            '                    allowFileAccess = true' \
            '                    allowContentAccess = true' \
            '                    setSupportZoom(false)' \
            '                    builtInZoomControls = false' \
            '                    displayZoomControls = false' \
            '                }' \
            '                addJavascriptInterface(AndroidHapticBridge(applicationContext), "AndroidNativeBridge")' \
            '                webChromeClient = WebChromeClient()' \
            '                webViewClient = object : WebViewClient() {' \
            '                    override fun shouldOverrideUrlLoading(' \
            '                        view: WebView?,' \
            '                        request: WebResourceRequest?' \
            '                    ): Boolean = false' \
            '                }' \
            '            }' \
            '            webView = wv' \
            '            setContentView(wv)' \
            '            wv.loadUrl("file:///android_asset/index.html")' \
            '        } catch (e: Throwable) {' \
            '            val fallback = FrameLayout(this).apply {' \
            '                setBackgroundColor(Color.parseColor("#050709"))' \
            '            }' \
            '            val label = TextView(this).apply {' \
            '                setTextColor(Color.WHITE)' \
            '                textSize = 15f' \
            '                setPadding(48, 96, 48, 48)' \
            '                text = "DebtReport Error: " + (e.message ?: "WebView unavailable")' \
            '            }' \
            '            fallback.addView(label)' \
            '            setContentView(fallback)' \
            '        }' \
            '    }' \
            '' \
            '    @Deprecated("Deprecated in Java")' \
            '    override fun onBackPressed() {' \
            '        try {' \
            '            val wv = webView' \
            '            if (wv != null && wv.canGoBack()) {' \
            '                wv.goBack()' \
            '                return' \
            '            }' \
            '        } catch (_: Throwable) {}' \
            '        super.onBackPressed()' \
            '    }' \
            '}' \
            '' \
            'class AndroidHapticBridge(private val appContext: Context) {' \
            '    @JavascriptInterface' \
            '    fun vibrate(durationMs: Long) {' \
            '        try {' \
            '            @Suppress("DEPRECATION")' \
            '            val vibrator = appContext.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator ?: return' \
            '            val safeMs = durationMs.coerceAtLeast(10L)' \
            '            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {' \
            '                vibrator.vibrate(' \
            '                    VibrationEffect.createOneShot(safeMs, VibrationEffect.DEFAULT_AMPLITUDE)' \
            '                )' \
            '            } else {' \
            '                @Suppress("DEPRECATION")' \
            '                vibrator.vibrate(safeMs)' \
            '            }' \
            '        } catch (_: Throwable) {}' \
            '    }' \
            '}' \
            > app/src/main/java/com/fintech/debtreport/MainActivity.kt
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html lang="th">' \
            '<head>' \
            '<meta charset="UTF-8" />' \
            '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />' \
            '<title>DebtReport</title>' \
            '<style>' \
            '  :root {' \
            '    --bg: #050709;' \
            '    --card: rgba(18, 23, 29, 0.72);' \
            '    --inner: rgba(255, 255, 255, 0.045);' \
            '    --border: rgba(255, 255, 255, 0.09);' \
            '    --sage: #70B286;' \
            '    --sage-hi: #88D49E;' \
            '    --sage-bg: rgba(30, 51, 38, 0.55);' \
            '    --amber: #E5A93C;' \
            '    --coral: #E06C75;' \
            '    --text: #F3F5F8;' \
            '    --muted: #8A94A6;' \
            '  }' \
            '  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }' \
            '  html, body {' \
            '    margin: 0; padding: 0; width: 100%; height: 100%;' \
            '    background: var(--bg); color: var(--text);' \
            '    font-family: -apple-system, BlinkMacSystemFont, "Sukhumvit Set", "Noto Sans Thai", sans-serif;' \
            '    overflow: hidden;' \
            '  }' \
            '  input, button { font-family: inherit; }' \
            '  .app-shell {' \
            '    position: relative; width: 100%; height: 100%;' \
            '    display: flex; flex-direction: column; overflow: hidden;' \
            '    background: radial-gradient(circle at 85% 5%, rgba(112,178,134,0.13), transparent 45%),' \
            '                radial-gradient(circle at 10% 35%, rgba(30,51,38,0.35), transparent 50%),' \
            '                #050709;' \
            '  }' \
            '  .main-scroll {' \
            '    flex: 1; overflow-y: auto; padding: 14px 14px 110px;' \
            '    scroll-behavior: smooth;' \
            '  }' \
            '  .glass-card {' \
            '    background: var(--card);' \
            '    border: 1px solid var(--border);' \
            '    border-radius: 20px;' \
            '    padding: 14px;' \
            '    margin-bottom: 12px;' \
            '    backdrop-filter: blur(20px) saturate(180%);' \
            '    -webkit-backdrop-filter: blur(20px) saturate(180%);' \
            '    box-shadow: 0 12px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);' \
            '  }' \
            '  .glass-inner {' \
            '    background: var(--inner);' \
            '    border: 1px solid rgba(255,255,255,0.07);' \
            '    border-radius: 14px;' \
            '    padding: 10px 12px;' \
            '  }' \
            '  .glass-transparent-btn {' \
            '    width: 100%;' \
            '    background: rgba(255,255,255,0.035);' \
            '    border: 1px dashed rgba(136,212,158,0.38);' \
            '    border-radius: 16px;' \
            '    padding: 12px 14px;' \
            '    color: var(--sage-hi);' \
            '    font-size: 13px;' \
            '    font-weight: 800;' \
            '    cursor: pointer;' \
            '    text-align: center;' \
            '    margin-bottom: 12px;' \
            '    transition: transform 0.15s, background 0.2s;' \
            '  }' \
            '  .glass-transparent-btn:active { transform: scale(0.98); background: rgba(112,178,134,0.14); }' \
            '  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }' \
            '  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }' \
            '  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }' \
            '  .title-sm { font-size: 11px; font-weight: 700; color: var(--muted); }' \
            '  .val-lg { font-size: 20px; font-weight: 900; letter-spacing: -0.02em; }' \
            '  .val-md { font-size: 15px; font-weight: 800; }' \
            '  .sage-text { color: var(--sage-hi); }' \
            '  .amber-text { color: var(--amber); }' \
            '  .coral-text { color: var(--coral); }' \
            '  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }' \
            '  .chips::-webkit-scrollbar { display: none; }' \
            '  .chip {' \
            '    border: 1px solid var(--border);' \
            '    background: rgba(255,255,255,0.03);' \
            '    color: var(--muted);' \
            '    padding: 6px 11px;' \
            '    border-radius: 12px;' \
            '    font-size: 11px;' \
            '    font-weight: 800;' \
            '    white-space: nowrap;' \
            '    cursor: pointer;' \
            '  }' \
            '  .chip.active {' \
            '    background: var(--sage-bg);' \
            '    color: var(--sage-hi);' \
            '    border-color: var(--sage);' \
            '  }' \
            '  .debt-item {' \
            '    display: flex; align-items: center; justify-content: space-between;' \
            '    gap: 10px; padding: 12px; margin-bottom: 8px;' \
            '    background: rgba(255,255,255,0.035);' \
            '    border: 1px solid rgba(255,255,255,0.07);' \
            '    border-radius: 16px;' \
            '    transition: transform 0.18s, border-color 0.18s, background 0.18s;' \
            '  }' \
            '  .debt-item.dragging {' \
            '    border-color: var(--sage-hi);' \
            '    background: rgba(30,51,38,0.65);' \
            '    transform: scale(1.02);' \
            '    box-shadow: 0 10px 28px rgba(0,0,0,0.65);' \
            '  }' \
            '  .check-btn {' \
            '    width: 26px; height: 26px; border-radius: 8px;' \
            '    border: 2px solid var(--sage); background: transparent;' \
            '    color: #000; font-weight: 900; display: flex; align-items: center; justify-content: center;' \
            '    cursor: pointer; flex-shrink: 0;' \
            '  }' \
            '  .check-btn.paid { background: var(--sage); }' \
            '  .icon-btn {' \
            '    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);' \
            '    color: var(--muted); border-radius: 10px; padding: 6px 8px;' \
            '    font-size: 11px; font-weight: 800; cursor: pointer;' \
            '  }' \
            '  .dock-wrap {' \
            '    position: fixed; left: 0; right: 0; bottom: 0;' \
            '    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));' \
            '    background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.6), transparent);' \
            '    z-index: 30;' \
            '  }' \
            '  .liquid-dock {' \
            '    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;' \
            '    padding: 6px; border-radius: 24px;' \
            '    background: rgba(16, 22, 28, 0.78);' \
            '    border: 1px solid rgba(255,255,255,0.14);' \
            '    backdrop-filter: blur(28px) saturate(240%);' \
            '    -webkit-backdrop-filter: blur(28px) saturate(240%);' \
            '    box-shadow: 0 16px 40px rgba(0,0,0,0.75), inset 0 1px 1px rgba(255,255,255,0.18);' \
            '  }' \
            '  @keyframes dockPulse {' \
            '    0% { box-shadow: inset 0 0 0 rgba(136,212,158,0), 0 0 0 rgba(112,178,134,0); }' \
            '    50% { box-shadow: inset 0 0 18px rgba(136,212,158,0.42), 0 0 14px rgba(112,178,134,0.28); }' \
            '    100% { box-shadow: inset 0 0 10px rgba(136,212,158,0.22), 0 0 8px rgba(112,178,134,0.14); }' \
            '  }' \
            '  .dock-btn {' \
            '    border: 1px solid transparent; background: transparent;' \
            '    color: var(--muted); border-radius: 18px; padding: 8px 4px;' \
            '    display: flex; flex-direction: column; align-items: center; gap: 3px;' \
            '    font-size: 11px; font-weight: 800; cursor: pointer;' \
            '  }' \
            '  .dock-btn.active {' \
            '    background: linear-gradient(145deg, rgba(40,72,52,0.72), rgba(22,38,28,0.78));' \
            '    border-color: rgba(136,212,158,0.45);' \
            '    color: var(--sage-hi);' \
            '    animation: dockPulse 1.8s infinite ease-in-out;' \
            '  }' \
            '  .modal-backdrop {' \
            '    position: fixed; inset: 0; background: rgba(0,0,0,0.82);' \
            '    backdrop-filter: blur(8px); z-index: 50;' \
            '    display: flex; align-items: center; justify-content: center; padding: 16px;' \
            '  }' \
            '  .modal-card {' \
            '    width: 100%; max-width: 380px; background: #0F1216;' \
            '    border: 1px solid #232931; border-radius: 22px; padding: 18px;' \
            '  }' \
            '  .input-box {' \
            '    width: 100%; background: #15191E; border: 1px solid #232931;' \
            '    border-radius: 12px; padding: 10px 12px; color: var(--text);' \
            '    font-size: 14px; font-weight: 700; margin-top: 4px; margin-bottom: 10px;' \
            '  }' \
            '  .primary-btn {' \
            '    width: 100%; background: var(--sage); color: #000; border: none;' \
            '    border-radius: 12px; padding: 11px; font-size: 13px; font-weight: 900; cursor: pointer;' \
            '  }' \
            '  .bar-track {' \
            '    width: 100%; height: 8px; background: rgba(255,255,255,0.07);' \
            '    border-radius: 99px; overflow: hidden; display: flex;' \
            '  }' \
            '</style>' \
            '</head>' \
            '<body>' \
            '<div class="app-shell">' \
            '  <div id="main-view" class="main-scroll"></div>' \
            '  <div class="dock-wrap">' \
            '    <nav class="liquid-dock">' \
            '      <button class="dock-btn active" onclick="switchTab(0)" id="tab-btn-0"><span>🧾</span><span>หนี้สิน</span></button>' \
            '      <button class="dock-btn" onclick="switchTab(1)" id="tab-btn-1"><span>💳</span><span>รายรับ-จ่าย</span></button>' \
            '      <button class="dock-btn" onclick="switchTab(2)" id="tab-btn-2"><span>✨</span><span>สุขภาพเงิน</span></button>' \
            '      <button class="dock-btn" onclick="switchTab(3)" id="tab-btn-3"><span>🕓</span><span>ประวัติ</span></button>' \
            '    </nav>' \
            '  </div>' \
            '</div>' \
            '<div id="modal-root"></div>' \
            '' \
            '<script>' \
            'const STORAGE_KEY = '\''debt_report_datastore_v1'\'';' \
            'const DEFAULT_STATE = {' \
            '  baseBudget: 45000,' \
            '  liveBalance: 22450,' \
            '  selectedFilter: '\''HAS_AMOUNT'\'',' \
            '  debts: [' \
            '    { id: '\''d1'\'', title: '\''บัตรเครดิต KTC Proud'\'', amount: 4800, dueDate: '\''25 ต.ค.'\'', isPaid: true, isNextMonth: false, paidAt: '\''2026-10-25 08:30'\'' },' \
            '    { id: '\''d2'\'', title: '\''ผ่อนคอนโด ลุมพินี'\'', amount: 8500, dueDate: '\''28 ต.ค.'\'', isPaid: true, isNextMonth: false, paidAt: '\''2026-10-25 09:00'\'' },' \
            '    { id: '\''d3'\'', title: '\''ค่าไฟ + เน็ตไฟเบอร์'\'', amount: 1650, dueDate: '\''29 ต.ค.'\'', isPaid: false, isNextMonth: false },' \
            '    { id: '\''d4'\'', title: '\''บัตรเครดิต SCB JCB'\'', amount: 3890, dueDate: '\''30 ต.ค.'\'', isPaid: false, isNextMonth: false },' \
            '    { id: '\''d5'\'', title: '\''Apple One + Netflix'\'', amount: 899, dueDate: '\''31 ต.ค.'\'', isPaid: false, isNextMonth: false },' \
            '    { id: '\''d6'\'', title: '\''ประกันรถยนต์ชั้น 1 (เดือนหน้า)'\'', amount: 3200, dueDate: '\''15 พ.ย.'\'', isPaid: false, isNextMonth: true }' \
            '  ],' \
            '  cashflows: [' \
            '    { id: '\''c1'\'', title: '\''ข้าวกะเพราหมูกรอบ + ไข่ดาว'\'', amount: 145, type: '\''EXPENSE'\'', timeLabel: '\''12:15'\'' },' \
            '    { id: '\''c2'\'', title: '\''เติมน้ำมันมอเตอร์ไซค์'\'', amount: 300, type: '\''EXPENSE'\'', timeLabel: '\''14:20'\'' },' \
            '    { id: '\''c3'\'', title: '\''รับงานฟรีแลนซ์ออกแบบกราฟิก'\'', amount: 4500, type: '\''INCOME'\'', timeLabel: '\''16:40'\'' },' \
            '    { id: '\''c4'\'', title: '\''ชาบูบุฟเฟต์กับเพื่อน'\'', amount: 680, type: '\''EXPENSE'\'', timeLabel: '\''19:10'\'' }' \
            '  ],' \
            '  archives: [' \
            '    { id: '\''a1'\'', monthLabel: '\''กันยายน 2026'\'', totalDebt: 18900, paidDebt: 18900, finalSaved: 11200, healthScore: 84 }' \
            '  ]' \
            '};' \
            '' \
            'let state = loadState();' \
            'let activeTab = 0;' \
            'let dragIdx = null;' \
            '' \
            'function loadState() {' \
            '  try {' \
            '    const raw = localStorage.getItem(STORAGE_KEY);' \
            '    if (raw) {' \
            '      const parsed = JSON.parse(raw);' \
            '      if (parsed && Array.isArray(parsed.debts)) return parsed;' \
            '    }' \
            '  } catch (e) {}' \
            '  return JSON.parse(JSON.stringify(DEFAULT_STATE));' \
            '}' \
            '' \
            'function saveState() {' \
            '  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}' \
            '}' \
            '' \
            'function haptic(ms) {' \
            '  try {' \
            '    if (window.AndroidNativeBridge && window.AndroidNativeBridge.vibrate) {' \
            '      window.AndroidNativeBridge.vibrate(ms || 18);' \
            '    } else if (navigator.vibrate) {' \
            '      navigator.vibrate(ms || 18);' \
            '    }' \
            '  } catch (e) {}' \
            '}' \
            '' \
            'function fmt(n) { return Number(n || 0).toLocaleString('\''th-TH'\''); }' \
            '' \
            'function buildArcPath(cx, cy, r, pct) {' \
            '  const clamped = Math.max(0, Math.min(100, pct));' \
            '  if (clamped <= 0) return '\''M '\'' + cx + '\'' '\'' + (cy - r);' \
            '  if (clamped >= 100) {' \
