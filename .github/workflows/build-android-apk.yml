name: Build Android APK (DebtReport)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify or Generate Android Gradle Project Files
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DebtReport"
          include(":app")
          EOF
          fi

          if [ ! -f "build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          fi

          if [ ! -f "gradle.properties" ]; then
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          fi

          mkdir -p app/src/main/java/com/fintech/debtreport

          if [ ! -f "app/build.gradle.kts" ]; then
            cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fintech.debtreport"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.fintech.debtreport"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 12
                  versionName = "1.2.0"
              }

              buildTypes {
                  debug {
                      applicationIdSuffix = ".debug"
                      isDebuggable = true
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          EOF
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:label="DebtReport"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          if [ ! -f "app/src/main/java/com/fintech/debtreport/MainActivity.kt" ]; then
            cat << 'EOF' > app/src/main/java/com/fintech/debtreport/MainActivity.kt
          package com.fintech.debtreport

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.View
          import android.view.WindowInsetsController
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#090B0E")
                  window.navigationBarColor = Color.parseColor("#090B0E")
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.setSystemBarsAppearance(
                          0,
                          WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS
                      )
                  }
                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#090B0E"))
                      overScrollMode = View.OVER_SCROLL_NEVER
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          cacheMode = WebSettings.LOAD_DEFAULT
                          mediaPlaybackRequiresUserGesture = false
                          allowFileAccess = true
                          allowContentAccess = true
                          setSupportZoom(false)
                      }
                      addJavascriptInterface(AndroidHapticBridge(this@MainActivity), "AndroidNativeBridge")
                      webChromeClient = WebChromeClient()
                      webViewClient = object : WebViewClient() {
                          override fun shouldOverrideUrlLoading(
                              view: WebView?,
                              request: WebResourceRequest?
                          ): Boolean = false
                      }
                      loadUrl("https://ais-pre-re33l6aaftlp3h5fymvshi-747894951104.asia-northeast1.run.app")
                  }
                  setContentView(webView)
              }
          }

          class AndroidHapticBridge(private val activity: Activity) {
              @JavascriptInterface
              fun vibrate(durationMs: Long) {
                  val vibrator = activity.getSystemService(Vibrator::class.java) ?: return
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vibrator.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                  } else {
                      @Suppress("DEPRECATION")
                      vibrator.vibrate(durationMs)
                  }
              }
          }
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload DebtReport APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebtReport-Android-APK
          path: app/build/outputs/apk/debug/*.apk
