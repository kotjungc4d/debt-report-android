            '' \
            'function setFilter(f) { haptic(12); state.selectedFilter = f; render(); }' \
            '' \
            'function toggleDebt(id) {' \
            '  haptic(25);' \
            '  const item = state.debts.find(d => d.id === id);' \
            '  if (!item) return;' \
            '  item.isPaid = !item.isPaid;' \
            '  if (item.isPaid) {' \
            '    state.liveBalance = Math.max(0, state.liveBalance - item.amount);' \
            '    item.paidAt = '\''วันนี้'\'';' \
            '  } else {' \
            '    state.liveBalance += item.amount;' \
            '  }' \
            '  render();' \
            '}' \
            '' \
            'function deleteDebt(id) {' \
            '  haptic(20);' \
            '  state.debts = state.debts.filter(d => d.id !== id);' \
            '  render();' \
            '}' \
            '' \
            'function moveDebt(id, dir) {' \
            '  haptic(15);' \
            '  const idx = state.debts.findIndex(d => d.id === id);' \
            '  if (idx < 0) return;' \
            '  const target = idx + dir;' \
            '  if (target < 0 || target >= state.debts.length) return;' \
            '  const temp = state.debts[idx];' \
            '  state.debts[idx] = state.debts[target];' \
            '  state.debts[target] = temp;' \
            '  render();' \
            '}' \
            '' \
            'let pressTimer = null;' \
            'let draggingDebtId = null;' \
            'function handleLongPressStart(e, id) {' \
            '  if (pressTimer) clearTimeout(pressTimer);' \
            '  pressTimer = setTimeout(() => {' \
            '    haptic(40);' \
            '    draggingDebtId = id;' \
            '    const el = document.querySelector('\''.debt-item[data-id="'\'' + id + '\''"]'\'');' \
            '    if (el) el.classList.add('\''dragging'\'');' \
            '  }, 320);' \
            '}' \
            'function handleDebtTouchMove(e) {' \
            '  if (!draggingDebtId || !e.touches || !e.touches[0]) return;' \
            '  e.preventDefault();' \
            '  const t = e.touches[0];' \
            '  const overEl = document.elementFromPoint(t.clientX, t.clientY);' \
            '  const rowEl = overEl && overEl.closest ? overEl.closest('\''.debt-item'\'') : null;' \
            '  if (!rowEl) return;' \
            '  const overId = rowEl.getAttribute('\''data-id'\'');' \
            '  if (!overId || overId === draggingDebtId) return;' \
            '  const fromIdx = state.debts.findIndex(d => d.id === draggingDebtId);' \
            '  const toIdx = state.debts.findIndex(d => d.id === overId);' \
            '  if (fromIdx < 0 || toIdx < 0) return;' \
            '  const moved = state.debts.splice(fromIdx, 1)[0];' \
            '  state.debts.splice(toIdx, 0, moved);' \
            '  haptic(12);' \
            '  render();' \
            '}' \
            'function handleLongPressEnd() {' \
            '  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }' \
            '  if (draggingDebtId) {' \
            '    draggingDebtId = null;' \
            '    render();' \
            '  }' \
            '}' \
            '' \
            'function addCashflow(type) {' \
            '  const titleEl = document.getElementById('\''cf-title'\'');' \
            '  const amtEl = document.getElementById('\''cf-amount'\'');' \
            '  const title = titleEl ? titleEl.value.trim() : '\'''\'';' \
            '  const amount = amtEl ? parseFloat(amtEl.value) : 0;' \
            '  if (!title || !amount || amount <= 0) return;' \
            '  haptic(25);' \
            '  const now = new Date();' \
            '  const timeLabel = String(now.getHours()).padStart(2,'\''0'\'') + '\'':'\'' + String(now.getMinutes()).padStart(2,'\''0'\'');' \
            '  state.cashflows.unshift({ id: '\''cf-'\'' + Date.now(), title, amount: Math.round(amount), type, timeLabel });' \
            '  if (type === '\''INCOME'\'') state.liveBalance += Math.round(amount);' \
            '  else state.liveBalance = Math.max(0, state.liveBalance - Math.round(amount));' \
            '  render();' \
            '}' \
            '' \
            'function deleteCashflow(id) {' \
            '  haptic(18);' \
            '  const target = state.cashflows.find(c => c.id === id);' \
            '  if (target) {' \
            '    if (target.type === '\''INCOME'\'') state.liveBalance = Math.max(0, state.liveBalance - target.amount);' \
            '    else state.liveBalance += target.amount;' \
            '  }' \
            '  state.cashflows = state.cashflows.filter(c => c.id !== id);' \
            '  render();' \
            '}' \
            '' \
            'function archiveMonth() {' \
            '  haptic(30);' \
            '  const currentDebts = state.debts.filter(d => !d.isNextMonth);' \
            '  const totalDebt = currentDebts.reduce((s, d) => s + d.amount, 0);' \
            '  const paidDebt = currentDebts.filter(d => d.isPaid).reduce((s, d) => s + d.amount, 0);' \
            '  state.archives.unshift({' \
            '    id: '\''arch-'\'' + Date.now(),' \
            '    monthLabel: '\''ตุลาคม 2026 (Snapshot)'\'',' \
            '    totalDebt,' \
            '    paidDebt,' \
            '    finalSaved: state.liveBalance,' \
            '    healthScore: 82' \
            '  });' \
            '  render();' \
            '}' \
            '' \
            'function openAddDebtModal() {' \
            '  haptic(15);' \
            '  document.getElementById('\''modal-root'\'').innerHTML = `' \
            '    <div class="modal-backdrop" onclick="closeModal(event)">' \
            '      <div class="modal-card" onclick="event.stopPropagation()">' \
            '        <div style="font-size:15px;font-weight:900;margin-bottom:10px;">เพิ่มรายการหนี้สิน / บิลใหม่</div>' \
            '        <label class="title-sm">ชื่อรายการ</label>' \
            '        <input id="m-title" class="input-box" placeholder="เช่น บัตรเครดิต, ค่าเน็ต, ผ่อนรถ" />' \
            '        <label class="title-sm">ยอดชำระ (บาท)</label>' \
            '        <input id="m-amount" class="input-box" type="number" inputmode="decimal" placeholder="0" />' \
            '        <label class="title-sm">กำหนดชำระ</label>' \
            '        <input id="m-due" class="input-box" value="30 ต.ค." />' \
            '        <div class="grid-2" style="margin-top:8px;">' \
            '          <button class="icon-btn" style="padding:11px;" onclick="closeModal()">ยกเลิก</button>' \
            '          <button class="primary-btn" onclick="saveNewDebt()">บันทึกรายการ</button>' \
            '        </div>' \
            '      </div>' \
            '    </div>' \
            '  `;' \
            '}' \
            '' \
            'function saveNewDebt() {' \
            '  const title = document.getElementById('\''m-title'\'').value.trim();' \
            '  const amount = parseFloat(document.getElementById('\''m-amount'\'').value);' \
            '  const dueDate = document.getElementById('\''m-due'\'').value.trim() || '\''สิ้นเดือน'\'';' \
            '  if (!title || !amount || amount <= 0) return;' \
            '  haptic(25);' \
            '  state.debts.unshift({' \
            '    id: '\''d-'\'' + Date.now(),' \
            '    title,' \
            '    amount: Math.round(amount),' \
            '    dueDate,' \
            '    isPaid: false,' \
            '    isNextMonth: false' \
            '  });' \
            '  closeModal();' \
            '  render();' \
            '}' \
            '' \
            'function openBalanceModal(mode) {' \
            '  haptic(15);' \
            '  const current = mode === '\''BASE_BUDGET'\'' ? state.baseBudget : state.liveBalance;' \
            '  const label = mode === '\''BASE_BUDGET'\'' ? '\''ตั้งค่างบตั้งต้นประจำเดือน'\'' : '\''อัปเดตยอดเงินคงเหลือจริง'\'';' \
            '  document.getElementById('\''modal-root'\'').innerHTML = `' \
            '    <div class="modal-backdrop" onclick="closeModal(event)">' \
            '      <div class="modal-card" onclick="event.stopPropagation()">' \
            '        <div style="font-size:15px;font-weight:900;margin-bottom:10px;">${label}</div>' \
            '        <input id="m-bal" class="input-box" type="number" inputmode="decimal" value="${current}" />' \
            '        <div class="grid-2" style="margin-top:8px;">' \
            '          <button class="icon-btn" style="padding:11px;" onclick="closeModal()">ยกเลิก</button>' \
            '          <button class="primary-btn" onclick="saveBalance('\''${mode}'\'')">บันทึกยอดเงิน</button>' \
            '        </div>' \
            '      </div>' \
            '    </div>' \
            '  `;' \
            '}' \
            '' \
            'function saveBalance(mode) {' \
            '  const val = parseFloat(document.getElementById('\''m-bal'\'').value);' \
            '  if (isNaN(val) || val < 0) return;' \
            '  haptic(25);' \
            '  if (mode === '\''BASE_BUDGET'\'') state.baseBudget = Math.round(val);' \
            '  else state.liveBalance = Math.round(val);' \
            '  closeModal();' \
            '  render();' \
            '}' \
            '' \
            'function closeModal() {' \
            '  document.getElementById('\''modal-root'\'').innerHTML = '\'''\'';' \
            '}' \
            '' \
            'render();' \
            '</script>' \
            '</body>' \
            '</html>' \
            > app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug
          test -f app/build/tmp/kotlin-classes/debug/com/fintech/debtreport/MainActivity.class
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload DebtReport APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebtReport-Android-APK
          path: app/build/outputs/apk/debug/*.apk
